name: 🧩 Rod Actions Console (All-in-One)

on:
  workflow_call:
    inputs:
      repository-key:
        description: Repository configuration key in config/paths.yml (defaults to caller repo name)
        type: string
        required: false
        default: ''
      config-repository:
        description: Central configuration repository
        type: string
        required: false
        default: rodkisten/github
      config-ref:
        description: Central configuration ref
        type: string
        required: false
        default: main
      node-version:
        description: Node.js version
        type: string
        required: false
        default: '24'
      working-directory:
        description: Default working directory
        type: string
        required: false
        default: '.'
      skip-bots:
        description: Skip expensive CI jobs when triggered by a bot actor
        type: boolean
        required: false
        default: false
      run-paths-filter:
        description: Evaluate path filters and run affected CI matrix
        type: boolean
        required: false
        default: true
      run-tests:
        description: Run tests in CI matrix
        type: boolean
        required: false
        default: true
      run-build:
        description: Run build in CI matrix
        type: boolean
        required: false
        default: true
      run-lint:
        description: Run lint in CI matrix
        type: boolean
        required: false
        default: false
      test-command:
        description: Default test command
        type: string
        required: false
        default: npm test
      build-command:
        description: Default build command
        type: string
        required: false
        default: npm run build
      lint-command:
        description: Default lint command
        type: string
        required: false
        default: npm run lint
      format-mode:
        description: Format mode (off, check, fix)
        type: string
        required: false
        default: check
      format-scope:
        description: Format scope (changed, all)
        type: string
        required: false
        default: changed
      format-base:
        description: Base ref for changed format scope
        type: string
        required: false
        default: origin/main
      auto-commit-format:
        description: Automatically commit formatted files on trusted same-repo PRs when format-mode is fix
        type: boolean
        required: false
        default: true
      comment-format-report:
        description: Post or update sticky PR format report comment
        type: boolean
        required: false
        default: true
      release-mode:
        description: Release mode (off, auto, major, minor, patch, exact)
        type: string
        required: false
        default: 'off'
      release-version:
        description: Exact version when release-mode is exact
        type: string
        required: false
        default: ''
      release-initial-version:
        description: Initial SemVer when no tags exist
        type: string
        required: false
        default: 1.0.0
      release-assets:
        description: Newline-separated glob patterns of assets to attach to release
        type: string
        required: false
        default: ''
      release-build-command:
        description: Optional build command before creating a release
        type: string
        required: false
        default: ''
      release-dry-run:
        description: Preview release without publishing
        type: boolean
        required: false
        default: false
      report-events:
        description: Collect workflow job and step notification candidates via Console
        type: boolean
        required: false
        default: true
    secrets:
      BOT_APP_ID:
        required: false
      BOT_PRIVATE_KEY:
        required: false
    outputs:
      skipped:
        description: Whether expensive CI jobs were skipped
        value: ${{ jobs.gate.outputs.skip }}
      skip-reason:
        description: Reason for skip decision
        value: ${{ jobs.gate.outputs.reason }}
      changes:
        description: JSON array of matched path filters
        value: ${{ jobs.paths.outputs.changes }}
      any-changes:
        description: Whether any path filter matched
        value: ${{ jobs.paths.outputs.any }}
      release-tag:
        description: Published or planned release tag
        value: ${{ jobs.release.outputs.tag }}
      release-published:
        description: Whether a GitHub release was published
        value: ${{ jobs.release.outputs.published }}
      event-count:
        description: Number of Console notification candidates collected
        value: ${{ jobs.console-report.outputs.event-count }}

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  # 1️⃣ GATE: Skip-CI & Central Console Config Resolution
  gate:
    name: 🚦 Gate & Console Config
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
      reason: ${{ steps.skip.outputs.reason }}
      notify-enabled: ${{ steps.console.outputs.notify-enabled }}
      configured-release-mode: ${{ steps.console.outputs.release-mode }}
    steps:
      - name: ⏭️ Evaluate Skip CI
        id: skip
        uses: rodkisten/github/src/skip-ci@main
        with:
          commit-message: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
          actor: ${{ github.actor }}
          skip-bots: ${{ inputs.skip-bots }}

      - name: 📥 Checkout central configuration
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.config-repository }}
          ref: ${{ inputs.config-ref }}
          path: .rod-actions
          sparse-checkout: config

      - name: 📥 Checkout repository override config
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/rod-actions.yml

      - name: 🧩 Resolve Rod Actions Console config
        id: console
        uses: rodkisten/github/src/console@main
        with:
          defaults: .rod-actions/config/rod-actions.yml
          config: .github/rod-actions.yml
          format-mode: 'off'
          report: 'false'

  # 2️⃣ FORMAT & LINT: Universal Formatter + Optional App Commit + Sticky PR Report
  format:
    name: 🎨 Universal Format & Lint
    needs: gate
    if: needs.gate.outputs.skip != 'true' && inputs.format-mode != 'off'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 📥 Checkout central configuration
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.config-repository }}
          ref: ${{ inputs.config-ref }}
          path: .rod-actions
          sparse-checkout: config

      - name: 🟩 Setup Node
        uses: rodkisten/github/src/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: 🌈 Setup rodlog
        uses: rodkisten/github/src/setup-rodlog@main

      - name: 🎨 Run Console Formatter
        id: run-format
        uses: rodkisten/github/src/console@main
        with:
          defaults: .rod-actions/config/rod-actions.yml
          config: .github/rod-actions.yml
          format-mode: ${{ inputs.format-mode }}
          format-scope: ${{ inputs.format-scope }}
          format-base: ${{ inputs.format-base }}
          commit-files-path: ${{ runner.temp }}/rod-format-commit.json
          results-file: ${{ runner.temp }}/rod-format-results.json
          report: 'false'

      - name: 🤖 Mint GitHub App token for auto-commit
        if: >-
          inputs.auto-commit-format &&
          inputs.format-mode == 'fix' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.run-format.outputs.format-changed-files != '[]' &&
          secrets.BOT_APP_ID != '' &&
          secrets.BOT_PRIVATE_KEY != ''
        id: app
        uses: rodkisten/github/src/app-token@main
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: 📝 Commit formatted files via GitHub App
        if: steps.app.outcome == 'success'
        uses: rodkisten/github/src/commit@main
        with:
          token: ${{ steps.app.outputs.token }}
          branch: ${{ github.event.pull_request.head.ref }}
          message: ${{ steps.run-format.outputs.suggested-commit }}
          files-path: ${{ runner.temp }}/rod-format-commit.json
          author-name: ${{ steps.app.outputs.app-slug }}[bot]
          author-email: ${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com

      - name: 📋 Update sticky PR format report
        if: >-
          always() &&
          inputs.comment-format-report &&
          github.event_name == 'pull_request' &&
          steps.run-format.outcome != 'skipped'
        uses: rodkisten/github/src/format-report@main
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          results-file: ${{ runner.temp }}/rod-format-results.json
          mode: ${{ inputs.format-mode }}
          scope: ${{ inputs.format-scope }}

  # 3️⃣ PATHS FILTER: Detect Affected Scopes
  paths:
    name: 🧬 Detect Affected Areas
    needs: gate
    if: needs.gate.outputs.skip != 'true' && inputs.run-paths-filter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
      files: ${{ steps.filter.outputs.files }}
      any: ${{ steps.filter.outputs.any }}
      full-run: ${{ steps.filter.outputs.full-run }}
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: 🧬 Evaluate central path rules
        id: filter
        uses: rodkisten/github/src/paths-filter@main
        with:
          token: ${{ github.token }}
          repository-key: ${{ inputs.repository-key }}
          config-repository: ${{ inputs.config-repository }}
          config-ref: ${{ inputs.config-ref }}
          working-directory: ${{ inputs.working-directory }}
          test-command: ${{ inputs.test-command }}
          build-command: ${{ inputs.build-command }}
          lint-command: ${{ inputs.lint-command }}
          run-tests: ${{ inputs.run-tests }}
          run-build: ${{ inputs.run-build }}
          run-lint: ${{ inputs.run-lint }}

  # 4️⃣ CI MATRIX: Parallel Test / Build / Lint per Affected Area
  ci:
    name: 🏗️ CI · ${{ matrix.filter }}
    needs: [gate, paths]
    if: needs.gate.outputs.skip != 'true' && inputs.run-paths-filter && needs.paths.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.paths.outputs.matrix || '[{"filter":"__noop__","working-directory":".","test-command":"npm test","build-command":"npm run build","lint-command":"npm run lint","run-tests":false,"run-build":false,"run-lint":false}]') }}
    steps:
      - uses: actions/checkout@v4

      - name: 🟩 Setup Node
        uses: rodkisten/github/src/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ matrix.working-directory }}

      - name: 🌈 Setup rodlog
        uses: rodkisten/github/src/setup-rodlog@main

      - name: 🧪 Run Node CI tasks
        uses: rodkisten/github/src/node-ci@main
        with:
          working-directory: ${{ matrix.working-directory }}
          scope: ${{ matrix.filter }}
          test-command: ${{ matrix.test-command }}
          build-command: ${{ matrix.build-command }}
          lint-command: ${{ matrix.lint-command }}
          run-tests: ${{ matrix.run-tests }}
          run-build: ${{ matrix.run-build }}
          run-lint: ${{ matrix.run-lint }}

      - name: 📋 Publish Filter Summary
        if: always()
        uses: rodkisten/github/src/ci-summary@main
        with:
          title: '🧬 CI · ${{ matrix.filter }}'
          status: ${{ job.status }}
          details: 'ROD_CI_FILTER=${{ matrix.filter }}'

  # 5️⃣ RELEASE: Hybrid SemVer Release
  release:
    name: 🚀 Hybrid Release
    needs: [gate, format, ci]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.skip != 'true' &&
      inputs.release-mode != 'off' &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      secrets.BOT_APP_ID != '' &&
      secrets.BOT_PRIVATE_KEY != ''
    uses: rodkisten/github/.github/workflows/hybrid-release.yml@main
    with:
      mode: ${{ inputs.release-mode }}
      version: ${{ inputs.release-version }}
      initial-version: ${{ inputs.release-initial-version }}
      assets: ${{ inputs.release-assets }}
      build-command: ${{ inputs.release-build-command }}
      dry-run: ${{ inputs.release-dry-run }}
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}

  # 6️⃣ CONSOLE REPORT: Final Event Collection & Required Check Gate
  console-report:
    name: 🧩 Console Final Report
    needs: [gate, format, paths, ci, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      event-count: ${{ steps.report.outputs.event-count }}
    steps:
      - name: 📥 Checkout central configuration
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.config-repository }}
          ref: ${{ inputs.config-ref }}
          path: .rod-actions
          sparse-checkout: config

      - name: 📥 Checkout repository override config
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/rod-actions.yml

      - name: 🧩 Collect workflow events & generate summary
        id: report
        uses: rodkisten/github/src/console@main
        with:
          defaults: .rod-actions/config/rod-actions.yml
          config: .github/rod-actions.yml
          format-mode: 'off'
          report: ${{ inputs.report-events }}
          github-token: ${{ github.token }}
          events-file: ${{ runner.temp }}/rod-console-events.json

      - name: 🚨 Enforce pipeline status
        if: >-
          needs.gate.result == 'failure' ||
          needs.format.result == 'failure' ||
          needs.paths.result == 'failure' ||
          needs.ci.result == 'failure' ||
          needs.release.result == 'failure'
        run: |
          echo "::error::One or more Console pipeline jobs failed."
          exit 1
