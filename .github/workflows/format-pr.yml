name: 🎨 Format PR
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [changed, all]
        default: changed
      mode:
        type: choice
        options: [check, fix]
        default: check
  pull_request:
    paths:
      - 'src/format/**'
      - 'actions/format/**'
      - 'src/console/**'
      - '.github/workflows/format-pr.yml'
      - 'tsdown.config.ts'
permissions:
  contents: read
  pull-requests: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
      - name: 🎨 Format source
        id: format
        uses: ./actions/format
        with:
          mode: ${{ inputs.mode || 'check' }}
          scope: ${{ inputs.scope || 'changed' }}
          base: origin/main
          results-file: ${{ runner.temp }}/rod-format-results.json
      - name: 🤖 Authenticate Rod App for PR report
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-issues: write
      - name: 📋 Update PR format report
        if: always() && steps.app.outcome == 'success'
        uses: ./actions/format-report
        with:
          github-token: ${{ steps.app.outputs.token }}
          pr-number: ${{ github.event.pull_request.number }}
          results-file: ${{ runner.temp }}/rod-format-results.json
          mode: ${{ inputs.mode || 'check' }}
          scope: ${{ inputs.scope || 'changed' }}
