name: 🎨 Format PR
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [changed, all]
        default: changed
      mode:
        type: choice
        options: [check, fix]
        default: check
  pull_request:
    paths:
      - 'src/format/**'
      - 'actions/format/**'
      - 'src/console/**'
      - '.github/workflows/format-pr.yml'
      - 'tsdown.config.ts'
permissions:
  contents: read
  pull-requests: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
      - name: 🎨 Format source
        id: format
        uses: ./actions/format
        with:
          mode: ${{ inputs.mode || 'check' }}
          scope: ${{ inputs.scope || 'changed' }}
          base: origin/main
