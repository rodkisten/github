name: 🎨 Format PR
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [changed, all]
        default: changed
      mode:
        type: choice
        options: [check, fix]
        default: check
  pull_request:
    paths:
      - 'src/format/**'
      - 'src/format-report/**'
      - 'src/console/**'
      - 'src/utils/**'
      - '.github/workflows/format-pr.yml'
      - '.github/workflows/console.yml'
      - 'tsdown.config.ts'
permissions:
  contents: read
  pull-requests: read
  issues: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
      - name: 🔬 Verify compiled action entrypoints
        shell: bash
        run: |
          set -euo pipefail
          for name in format format-report commit app-token console console-run skip-ci setup-rodlog; do
            file="dist/${name}.js"
            test -s "$file" || { echo "::error::Missing bundle $file"; exit 1; }
            node --check "$file"
          done
          # Shared chunks are valid as long as the build includes them.
          for chunk in dist/*.js; do
            node --check "$chunk"
          done
      - name: 🎨 Format source
        id: format
        uses: ./src/format
        with:
          mode: ${{ inputs.mode || (github.event.pull_request.head.repo.full_name == github.repository && 'fix') || 'check' }}
          scope: ${{ inputs.scope || 'changed' }}
          base: origin/main
          results-file: ${{ runner.temp }}/rod-format-results.json
          commit-files-path: ${{ runner.temp }}/rod-format-commit.json
      - name: 🤖 Authenticate Rod App for PR report
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: app
        uses: ./src/app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-issues: write
          permission-contents: write
      - name: 📝 Commit formatter changes with Rod App
        if: steps.app.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.format.outputs.changed-files != '[]'
        uses: ./src/commit
        with:
          token: ${{ steps.app.outputs.token }}
          branch: ${{ github.event.pull_request.head.ref }}
          message: ${{ steps.format.outputs.suggested-commit }}
          files-path: ${{ runner.temp }}/rod-format-commit.json
          author-name: ${{ steps.app.outputs.app-slug }}[bot]
          author-email: ${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com
      - name: 📋 Update PR format report
        if: always() && github.event_name == 'pull_request' && steps.format.outcome == 'success' && steps.app.outcome == 'success'
        uses: ./src/format-report
        with:
          github-token: ${{ steps.app.outputs.token }}
          pr-number: ${{ github.event.pull_request.number }}
          results-file: ${{ runner.temp }}/rod-format-results.json
          mode: ${{ inputs.mode || (github.event.pull_request.head.repo.full_name == github.repository && 'fix') || 'check' }}
          scope: ${{ inputs.scope || 'changed' }}
