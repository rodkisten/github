name: Migrate refactored actions into src
on:
  push:
    branches:
      - fix/validate-action-integrity-20261121
    paths:
      - .github/workflows/migrate-actions-once.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply source archive and fix action paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:rod-actions-refactored.zip > /tmp/rod-actions-refactored.zip
          python3 - <<'PY'
          import pathlib, zipfile, re, shutil
          root = pathlib.Path('.')
          with zipfile.ZipFile('/tmp/rod-actions-refactored.zip') as archive:
              for info in archive.infolist():
                  if info.is_dir():
                      continue
                  path = pathlib.PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise ValueError('Unsafe archive path: ' + info.filename)
                  target = root / ('src/' + '/'.join(path.parts[1:]) if path.parts[0] == 'actions' else info.filename)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(info))
          if (root / 'actions').exists():
              shutil.rmtree(root / 'actions')
          for base in (root / '.github', root / 'src', root / 'docs', root / 'config'):
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.yml', '.yaml', '.md', '.ts', '.tsx', '.json'}:
                      continue
                  try:
                      original = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  revised = original.replace('./actions/', './src/').replace('rodkisten/github/actions/', 'rodkisten/github/src/')
                  if revised != original:
                      path.write_text(revised)
          PY
          rm .github/workflows/migrate-actions-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: migrate ZIP actions into src and update references [deploy]'
          git push origin HEAD:fix/validate-action-integrity-20261121
