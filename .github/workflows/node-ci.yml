name: Shared Node CI
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      working-directory:
        type: string
        default: '.'
      test-command:
        type: string
        default: 'npm test'
      build-command:
        type: string
        default: 'npm run build'
      run-tests:
        type: boolean
        default: true
      run-build:
        type: boolean
        default: true
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rodkisten/github/actions/setup-node@v1
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: 🟦 TypeScript test/build runner
        uses: rodkisten/github/actions/node-ci@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          test-command: ${{ inputs.test-command }}
          build-command: ${{ inputs.build-command }}
          run-tests: ${{ inputs.run-tests }}
          run-build: ${{ inputs.run-build }}
      - name: Summary
        if: always()
        uses: rodkisten/github/actions/ci-summary@v1
        with:
          title: Node CI
          status: ${{ job.status }}
