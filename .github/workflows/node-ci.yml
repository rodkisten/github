name: Shared Node CI
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      working-directory:
        type: string
        default: '.'
      test-command:
        type: string
        default: 'npm test'
      build-command:
        type: string
        default: 'npm run build'
      run-tests:
        type: boolean
        default: true
      run-build:
        type: boolean
        default: true
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rodkisten/github/actions/setup-node@v1
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Test
        if: inputs.run-tests
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build
        if: inputs.run-build
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Summary
        if: always()
        uses: rodkisten/github/actions/ci-summary@v1
        with:
          title: Node CI
          status: ${{ job.status }}
