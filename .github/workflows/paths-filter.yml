name: 🧬 Shared TypeScript paths filter
on:
  workflow_call:
    inputs:
      repository-key:
        description: Repository configuration key (defaults to caller repo name)
        type: string
        required: false
        default: ''
      base:
        description: Optional base commit or ref for push comparison
        type: string
        required: false
        default: ''
      config-repository:
        description: Repository holding centralized filter rules
        type: string
        required: false
        default: rodkisten/github
      config-ref:
        description: Reviewed ref containing the filter configuration
        type: string
        required: false
        default: main
      config-path:
        description: YAML path in the configuration repository
        type: string
        required: false
        default: config/paths.yml
    outputs:
      changes:
        description: JSON array of matching filter names
        value: ${{ jobs.filter.outputs.changes }}
      any:
        description: Whether any filter matched
        value: ${{ jobs.filter.outputs.any }}
      files:
        description: JSON array of changed file paths
        value: ${{ jobs.filter.outputs.files }}
      full-run:
        description: Whether all filters were selected as a safe initial-push fallback
        value: ${{ jobs.filter.outputs.full-run }}
jobs:
  filter:
    name: 🟦 Evaluate changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changes: ${{ steps.paths.outputs.changes }}
      any: ${{ steps.paths.outputs.any }}
      files: ${{ steps.paths.outputs.files }}
      full-run: ${{ steps.paths.outputs.full-run }}
    steps:
      - name: 🧬 Evaluate filters using Node 24
        id: paths
        uses: rodkisten/github/actions/paths-filter@v1
        with:
          token: ${{ github.token }}
          repository-key: ${{ inputs.repository-key }}
          config-repository: ${{ inputs.config-repository }}
          config-ref: ${{ inputs.config-ref }}
          config-path: ${{ inputs.config-path }}
          base: ${{ inputs.base }}
