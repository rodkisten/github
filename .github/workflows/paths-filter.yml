name: Shared paths filter
on:
  workflow_call:
    inputs:
      repository-key:
        type: string
        required: false
        default: ''
      base:
        type: string
        required: false
        default: ''
    outputs:
      changes:
        description: JSON object of matching filters
        value: ${{ jobs.filter.outputs.changes }}
      any:
        description: Whether any filter matched
        value: ${{ jobs.filter.outputs.any }}
jobs:
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changes: ${{ steps.paths.outputs.changes }}
      any: ${{ steps.decision.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: rodkisten/github
          ref: feat/shared-ci-foundation
          path: .shared-ci
          persist-credentials: false
      - name: Select repository filters
        id: config
        shell: bash
        env:
          REPOSITORY_KEY: ${{ inputs.repository-key }}
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python .shared-ci/scripts/select-paths.py \
            --config .shared-ci/config/paths.yml \
            --repository "${REPOSITORY_KEY:-${GITHUB_REPOSITORY#*/}}" \
            --output "$RUNNER_TEMP/selected-filters.yml"
          echo "file=$RUNNER_TEMP/selected-filters.yml" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          base: ${{ inputs.base }}
          filters: ${{ steps.config.outputs.file }}
      - name: Calculate gate
        id: decision
        shell: bash
        env:
          CHANGES: ${{ steps.paths.outputs.changes }}
        run: |
          python - <<'PY'
          import json, os
          changes = json.loads(os.environ.get('CHANGES') or '[]')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"any={str(bool(changes)).lower()}\n")
          PY
