name: 🚀 Build · Test · Semantic Release

run-name: "🚀 [${{ github.head_ref || github.ref_name }}] · ${{ github.event.pull_request.title || github.event.head_commit.message || (github.event_name == 'schedule' && 'Execução agendada') || format('Execução manual por @{0}', github.actor) }}"

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: shared-actions-release
  cancel-in-progress: false

jobs:
  release:
    name: 🧪 Build, verify & publish

    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          !contains(github.event.head_commit.message || '', '[skip ci]') &&
          !contains(github.event.head_commit.message || '', '[ci skip]')
        )
      )

    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Validate GitHub App credentials
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BOT_APP_ID" ]]; then
            echo "::error::BOT_APP_ID is missing."
            exit 1
          fi
          if [[ -z "$BOT_PRIVATE_KEY" ]]; then
            echo "::error::BOT_PRIVATE_KEY is missing."
            exit 1
          fi

      - name: 🤖 Authenticate Rod GitHub App
        id: app-token
        uses: rodkisten/github/src/app-token@main
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: 🟩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci


      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: 🧪 Vitest
        run: npm test

      - name: 🏗️ Build all bundles
        run: npm run build

      - name: 📋 Verify bundles
        shell: bash
        run: |
          set -euo pipefail

          bundles=(
            app-token
            ci-summary
            commit
            console
            console-run
            create-pr
            format
            format-report
            node-ci
            paths-filter
            publish
            setup-rodlog
            skip-ci
          )

          for bundle in "${bundles[@]}"; do
            file="dist/${bundle}.js"

            if [[ ! -s "$file" ]]; then
              echo "::error::Missing bundle: $file"
              exit 1
            fi

            node --check "$file"
            echo "✅ $file"
          done

      - name: 📦 Publish compiled action bundles to main
        shell: bash
        env:
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # Commit all generated JS and chunks, not only action entrypoints.
          git add -f -A dist/
          if ! git diff --cached --quiet; then
            git commit -m "build(actions): publish executable bundles [skip ci]"
            git push origin HEAD:main
          fi

      - name: 🚀 Semantic Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: npx --no-install semantic-release

      - name: 🧾 Release summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo '# 🚀 Shared Actions Release'
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Result | $RESULT |"
            echo "| Ref | \`$REF\` |"
            echo "| Commit | \`${SHA:0:7}\` |"
            echo
            echo '### 📦 Bundles'
            for file in dist/*.js; do
              [[ -s "$file" ]] && echo "- \`$file\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
