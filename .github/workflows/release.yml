name: 🚀 Build · Test · Semantic Release
run-name: 🚀 ${{ github.ref_name }} · ${{ github.event.head_commit.message || github.event_name }}
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: shared-actions-release
  cancel-in-progress: false
jobs:
  release:
    name: 🧪 Build, verify & publish
    runs-on: ubuntu-latest
    steps:
      - name: 🤖 Authenticate Rod GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: 📥 Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}
      - name: 🟩 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 📦 Install dependencies
        run: npm install --no-audit --no-fund
      - name: 🌈 Install rodlog
        uses: ./actions/setup-rodlog
      - name: 🔎 Typecheck
        run: rodlog exec --tool=typescript --mode=transform -- npm run typecheck
      - name: 🧪 Tests
        run: rodlog exec --mode=transform -- npm test
      - name: 🏗️ Bundle JavaScript actions
        run: rodlog exec --mode=transform -- npm run build
      - name: 📋 Verify action bundle
        run: test -s dist/paths-filter.js
      - name: 🏷️ Analyze commits, version & publish release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: npx --no-install semantic-release
      - name: 🧾 Summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo '## 🚀 Shared Actions Release' >> "$GITHUB_STEP_SUMMARY"
          echo "Result: **$RESULT**" >> "$GITHUB_STEP_SUMMARY"
          echo 'Semantic versioning uses Conventional Commits: feat = minor, fix = patch, BREAKING CHANGE = major.' >> "$GITHUB_STEP_SUMMARY"
