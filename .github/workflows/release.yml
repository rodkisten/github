name: 🚀 Build · Test · Semantic Release
run-name: 🚀 ${{ github.ref_name }} · ${{ github.event.head_commit.message || github.event_name }}
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: shared-actions-release
  cancel-in-progress: false
jobs:
  release:
    name: 🧪 Build, verify & publish
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: 🟩 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 📦 Install dependencies
        run: npm install --no-audit --no-fund
      - name: 🔎 Typecheck
        run: npm run typecheck
      - name: 🧪 Tests
        run: npm test
      - name: 🏗️ Bundle JavaScript actions
        run: npm run build
      - name: 📋 Verify action bundle
        run: test -s dist/paths-filter.js
      - name: 🏷️ Analyze commits, version & publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx --no-install semantic-release
      - name: 🧾 Summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo '## 🚀 Shared Actions Release' >> "$GITHUB_STEP_SUMMARY"
          echo "Result: **$RESULT**" >> "$GITHUB_STEP_SUMMARY"
          echo 'Semantic versioning uses Conventional Commits: feat = minor, fix = patch, BREAKING CHANGE = major.' >> "$GITHUB_STEP_SUMMARY"
