
name: 🚀 Build · Test · Semantic Release

run-name: 🚀 ${{ github.ref_name }} · ${{ github.event.head_commit.message || github.event_name }}

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: shared-actions-release
  cancel-in-progress: false

jobs:
  release:
    name: 🧪 Build, verify & publish

    # Nunca publicar versões a partir de uma branch de feature.
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          !contains(github.event.head_commit.message || '', '[skip ci]') &&
          !contains(github.event.head_commit.message || '', '[ci skip]')
        )
      )

    runs-on: ubuntu-latest

    steps:
      # 🔐 Validate secrets without exposing their values.
      - name: 🔐 Validate GitHub App credentials
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$BOT_APP_ID" ]]; then
            echo "::error::BOT_APP_ID is missing."
            exit 1
          fi

          if [[ -z "$BOT_PRIVATE_KEY" ]]; then
            echo "::error::BOT_PRIVATE_KEY is missing."
            exit 1
          fi

      # 🤖 GitHub App authentication.
      - name: 🤖 Authenticate Rod GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # 📥 Checkout complete history.
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      # 🟩 Node 24.
      - name: 🟩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 📦 Reproducible installation.
      - name: 📦 Install dependencies
        run: npm ci

      # 🌈 Rodlog.
      - name: 🌈 Install rodlog
        uses: ./actions/setup-rodlog

      # 🔎 TypeScript.
      - name: 🔎 Typecheck
        run: rodlog exec --tool=typescript --mode=transform -- npm run typecheck

      # 🧪 Complete test suite.
      - name: 🧪 Vitest
        run: rodlog exec --mode=transform -- npm test

      # 🏗️ Build every action.
      - name: 🏗️ Build all bundles
        run: rodlog exec --mode=transform -- npm run build

      # 📋 Verify every expected bundle.
      - name: 📋 Verify bundles
        shell: bash
        run: |
          set -euo pipefail

          bundles=(
            paths-filter
            node-ci
            ci-summary
            create-pr
            commit
            publish
          )

          for bundle in "${bundles[@]}"; do
            file="dist/${bundle}.js"

            if [[ ! -s "$file" ]]; then
              echo "::error::Missing bundle: $file"
              exit 1
            fi

            node --check "$file"

            echo "✅ $file"
          done

      # 📦 Semantic release.
      - name: 🚀 Semantic Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com

          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: npx --no-install semantic-release

      # 🧾 Always report the result.
      - name: 🧾 Release summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo '# 🚀 Shared Actions Release'
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Result | $RESULT |"
            echo "| Ref | \`$REF\` |"
            echo "| Commit | \`${SHA:0:7}\` |"
            echo
            echo '### 📦 Bundles'
            for file in dist/*.js; do
              [[ -s "$file" ]] && echo "- \`$file\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
