name: 🧩 Validate Actions Console
on:
  pull_request:
    paths:
      - 'src/console/**'
      - 'tests/console-*.test.ts'
      - 'actions/console/**'
      - 'actions/console-run/**'
      - 'config/rod-actions.yml'
      - 'tsdown.config.ts'
      - '.github/workflows/validate-console.yml'
      - '.github/workflows/hybrid-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify console bundles
        run: test -s dist/console.js && test -s dist/console-run.js
