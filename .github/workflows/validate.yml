name: 🧪 Validate TypeScript Actions
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: 🟦 Typecheck · Vitest · Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 📦 Install
        run: npm install --no-audit --no-fund
      - name: 🔎 Typecheck
        run: npm run typecheck
      - name: 🧪 Vitest
        run: npm test
      - name: 🏗️ Bundle
        run: npm run build
      - name: 📋 Verify artifacts and YAML
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync, statSync } from 'node:fs';
          import { globSync } from 'node:fs';
          import YAML from 'yaml';
          for (const path of [...globSync('actions/**/*.yml'), ...globSync('.github/workflows/*.yml')]) {
            YAML.parse(readFileSync(path, 'utf8'));
            console.log('✅', path);
          }
          if (!existsSync('dist/paths-filter.js') || !statSync('dist/paths-filter.js').size) {
            throw new Error('Missing bundled paths-filter action');
          }
          NODE
