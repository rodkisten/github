name: Validate shared CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2'
      - name: Run policy tests
        run: python -m unittest discover -s tests -v
      - name: Validate configured repositories
        run: |
          for repo in userscripts-cf photointel shell roteador; do
            python scripts/select-paths.py --config config/paths.yml --repository "$repo" --output "/tmp/$repo.yml"
          done
      - name: Validate action and workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for directory in ('actions', '.github/workflows'):
              for path in Path(directory).rglob('*.yml'):
                  with path.open() as stream:
                      yaml.safe_load(stream)
                  print('OK', path)
          PY
