name: 🧪 Validate TypeScript Actions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: 🟦 Typecheck · Vitest · Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 📦 Install
        run: npm ci --no-audit --no-fund
      - name: 🔎 Typecheck
        run: npm run typecheck
      - name: 🧪 Vitest
        run: npm test
      - name: 🏗️ Bundle
        run: npm run build
      - name: 📋 Verify action contracts and bundles
        run: node scripts/validate-actions.mjs
      - name: 🧪 Smoke-test Skip CI action
        id: skip-smoke
        uses: ./src/skip-ci
        with:
          commit-message: 'docs: update readme [skip ci]'
      - name: Assert skip decision
        env:
          SKIP: ${{ steps.skip-smoke.outputs.skip }}
          REASON: ${{ steps.skip-smoke.outputs.reason }}
        run: test "$SKIP" = true && test "$REASON" = commit-marker
      - name: 🧪 Smoke-test bundled TypeScript Node CI action
        uses: ./src/node-ci
        with:
          working-directory: .
          test-command: node -e "process.exit(0)"
          build-command: node -e "process.exit(0)"
          run-tests: 'true'
          run-build: 'true'
      - name: 🧯 Smoke-test expected command failure
        id: expected-failure
        continue-on-error: true
        uses: ./src/node-ci
        with:
          test-command: node -e "process.exit(7)"
          run-build: 'false'
      - name: 🔍 Assert failure was propagated
        env:
          OUTCOME: ${{ steps.expected-failure.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::Expected TypeScript Node CI action to fail, got $OUTCOME"
            exit 1
          fi
          echo '🧯 Expected failure correctly propagated.' >> "$GITHUB_STEP_SUMMARY"
      - name: 📝 Smoke-test TypeScript CI summary
        uses: ./src/ci-summary
        with:
          title: '🧪 TypeScript Action integration'
          status: success
          details: 'Bundled Node 24 summary action executed successfully.'
      - name: Smoke-test console runner
        id: console-smoke
        uses: ./src/console-run
        with:
          command: 'printf smoke-ok'
      - name: Assert console runner outputs
        env:
          EXIT_CODE: ${{ steps.console-smoke.outputs.exit-code }}
          DURATION: ${{ steps.console-smoke.outputs.duration-ms }}
        run: |
          test "$EXIT_CODE" = 0
          [[ "$DURATION" =~ ^[0-9]+$ ]]
      - name: Generate action catalog
        run: npm run docs:actions
      - uses: actions/upload-artifact@v4
        with:
          name: action-catalog
          path: docs/ACTION_CATALOG.md

  pnpm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated pnpm fixture
        run: |
          mkdir -p .pnpm-smoke
          printf '%s\\n' '{"name":"pnpm-smoke","private":true,"packageManager":"pnpm@10.28.2"}' > .pnpm-smoke/package.json
          printf '%s\\n' "lockfileVersion: '9.0'" '' 'importers:' '  .: {}' > .pnpm-smoke/pnpm-lock.yaml
      - uses: ./src/setup-pnpm
        with:
          working-directory: .pnpm-smoke
          cache: 'false'
          ignore-scripts: 'true'
      - name: Verify pnpm version
        run: test "$(pnpm --version)" = 10.28.2
