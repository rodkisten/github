name: 🧪 Validate TypeScript Actions
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: 🟦 Typecheck · Vitest · Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 📦 Install
        run: npm ci --no-audit --no-fund
      - name: 🔎 Typecheck
        run: npm run typecheck
      - name: 🧪 Vitest
        run: npm test
      - name: 🏗️ Bundle
        run: npm run build
      - name: 🧪 Smoke-test Skip CI action
        id: skip-smoke
        uses: ./src/skip-ci
        with:
          commit-message: 'docs: update readme [skip ci]'
      - name: 🧪 Smoke-test bundled TypeScript Node CI action
        uses: ./src/node-ci
        with:
          working-directory: .
          test-command: node -e "process.exit(0)"
          build-command: node -e "process.exit(0)"
          run-tests: 'true'
          run-build: 'true'
      - name: 🧯 Smoke-test expected command failure
        id: expected-failure
        continue-on-error: true
        uses: ./src/node-ci
        with:
          test-command: node -e "process.exit(7)"
          run-build: 'false'
      - name: 🔍 Assert failure was propagated
        env:
          OUTCOME: ${{ steps.expected-failure.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::Expected TypeScript Node CI action to fail, got $OUTCOME"
            exit 1
          fi
          echo '🧯 Expected failure correctly propagated.' >> "$GITHUB_STEP_SUMMARY"
      - name: 📝 Smoke-test TypeScript CI summary
        uses: ./src/ci-summary
        with:
          title: '🧪 TypeScript Action integration'
          status: success
          details: 'Bundled Node 24 summary action executed successfully.'
      - name: 📋 Verify artifacts and YAML
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync, statSync, globSync } from 'node:fs';
          import YAML from 'yaml';
          for (const path of [...globSync('src/**/action.yml'), ...globSync('.github/workflows/*.yml')]) {
            YAML.parse(readFileSync(path, 'utf8'));
            console.log('✅', path);
          }
          const expectedBundles = [
            'app-token',
            'ci-summary',
            'commit',
            'console',
            'console-run',
            'create-pr',
            'format',
            'format-report',
            'node-ci',
            'paths-filter',
            'publish',
            'setup-rodlog',
            'skip-ci',
          ];
          for (const name of expectedBundles) {
            if (!existsSync(`dist/${name}.js`) || !statSync(`dist/${name}.js`).size) {
              throw new Error(`Missing bundled ${name} action`);
            }
          }
          NODE
