name: "📦 Import ZIPs → PR"

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:
    inputs:
      output_path:
        description: "Pasta de destino no repositório (use '.' para raiz ou ex.: src/runtime/solid-ui)"
        required: false
        default: "."
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-zips-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    name: "📦 Extrair ZIPs e abrir PR"
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate Rod GitHub App
        id: app-token
        uses: rodkisten/github/src/app-token@main
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Extract tracked ZIP archives safely
        id: extract
        shell: bash
        env:
          OUTPUT_PATH: ${{ inputs.output_path || '.' }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, mkdirSync, rmSync } from 'node:fs';
          import path from 'node:path';

          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };

          const writeOutputs = (outputs) => {
            const outputPath = process.env.GITHUB_OUTPUT;
            if (!outputPath) return;
            const lines = Object.entries(outputs).map(([k, v]) => `${k}=${v}`);
            appendFileSync(outputPath, `${lines.join('\n')}\n`);
          };

          const isInsideOrSame = (base, candidate) => {
            const rel = path.relative(base, candidate);
            return rel === '' || (!rel.startsWith('..') && !path.isAbsolute(rel));
          };

          const root = path.resolve(process.cwd());
          const gitDir = path.join(root, '.git');
          const rawInput = (process.env.OUTPUT_PATH ?? '.').trim().replaceAll('\\', '/');
          const normalizedRaw = rawInput.replace(/\/+$/, '') || '.';
          const isRootTarget = normalizedRaw === '.' || normalizedRaw === './';

          if (!isRootTarget) {
            const parts = normalizedRaw.split('/');
            if (
              normalizedRaw.startsWith('/') ||
              parts.some((part) => part === '' || part === '.' || part === '..')
            ) {
              fail('Invalid output_path: choose "." or a clean relative directory inside the repository');
            }
          }

          const target = isRootTarget ? root : path.resolve(root, normalizedRaw);

          if (!isInsideOrSame(root, target) || isInsideOrSame(gitDir, target)) {
            fail('Destination must be the repository root or a directory inside the repository');
          }

          const tracked = execFileSync('git', ['ls-files', '-z'])
            .toString('utf8')
            .split('\0')
            .filter(Boolean);

          const archives = tracked
            .filter((p) => p.toLowerCase().endsWith('.zip'))
            .sort()
            .map((p) => path.resolve(root, p));

          if (archives.length === 0) {
            console.log('No tracked ZIP archives found. Nothing to import.');
            writeOutputs({ archives: 0, files: 0, destination_label: isRootTarget ? 'raiz do repositório (.)' : normalizedRaw });
            process.exit(0);
          }

          console.log(`Found ${archives.length} tracked ZIP(s) → target: ${isRootTarget ? '.' : normalizedRaw}`);

          const seen = new Set();
          let extracted = 0;
          let totalSize = 0;
          const maxTotal = 500 * 1024 * 1024;
          const maxFiles = 20000;

          mkdirSync(target, { recursive: true });

          for (const archive of archives) {
            const relArchive = path.relative(root, archive);
            console.log(`::group::Extract ${relArchive}`);

            // Lista metadados técnicos com unzip -Z (-l com permissões unix e tamanho exato)
            let listing;
            try {
              listing = execFileSync('unzip', ['-Z', '-l', archive], {
                encoding: 'utf8',
                maxBuffer: 64 * 1024 * 1024,
              });
            } catch (error) {
              fail(`Failed to read ZIP archive ${relArchive}: ${error.message}`);
            }

            // Formato típico da linha de entrada do `unzip -Z -l`:
            // -rw-r--r--  3.0 unx     1234 tx defN 26-Nov-21 22:40 path/to/file.ts
            const entryRegex = /^([drwxstlp-]{10})\s+\S+\s+\S+\s+(\d+)\s+\S+\s+\S+\s+\S+\s+\S+\s+(.+)$/;

            for (const line of listing.split(/\r?\n/)) {
              const match = line.match(entryRegex);
              if (!match) continue;

              const [, perms, sizeStr, rawEntryName] = match;
              const name = rawEntryName.replaceAll('\\', '/');
              const segments = name.split('/');

              if (
                !name ||
                name.startsWith('/') ||
                segments.some((p, idx) => p === '.' || p === '..' || (p === '' && idx !== segments.length - 1))
              ) {
                fail(`Unsafe ZIP path: ${path.basename(archive)}: ${name}`);
              }

              if (segments.includes('.git')) {
                fail(`Git metadata is not allowed: ${name}`);
              }

              if (perms.startsWith('l')) {
                fail(`ZIP symlink not allowed: ${name}`);
              }

              const destination = path.resolve(target, name);
              if (!isInsideOrSame(target, destination) || isInsideOrSame(gitDir, destination)) {
                fail(`ZIP entry escapes destination or targets .git: ${name}`);
              }

              // Ignora entradas de diretório
              if (perms.startsWith('d') || name.endsWith('/')) {
                continue;
              }

              if (seen.has(destination)) {
                fail(`Duplicate destination across ZIPs: ${path.relative(root, destination)}`);
              }

              seen.add(destination);
              extracted += 1;
              totalSize += Number(sizeStr);

              if (extracted > maxFiles || totalSize > maxTotal) {
                fail('ZIP extraction safety limit exceeded');
              }
            }

            // Extrai o arquivo validado sobrescrevendo no diretório alvo
            execFileSync('unzip', ['-qq', '-o', archive, '-d', target], { stdio: 'inherit' });
            console.log('::endgroup::');
          }

          for (const archive of archives) {
            rmSync(archive, { force: true });
            console.log(`Removed ZIP: ${path.relative(root, archive)}`);
          }

          const destLabel = isRootTarget ? 'raiz do repositório (.)' : normalizedRaw;
          console.log(`Extracted ${extracted} files into ${destLabel}; removed ${archives.length} ZIP archives`);

          writeOutputs({
            archives: archives.length,
            files: extracted,
            destination_label: destLabel,
          });
          JS

      - name: Open pull request
        if: steps.extract.outputs.archives != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(import): extract repository ZIP archives"
          branch: automation/import-zips
          delete-branch: true
          title: "📦 Importar arquivos ZIP para ${{ steps.extract.outputs.destination_label }}"
          body: |
            Importação automática dos arquivos ZIP versionados no repositório.

            - **Destino:** `${{ steps.extract.outputs.destination_label }}`
            - **Arquivos ZIP:** ${{ steps.extract.outputs.archives }}
            - **Arquivos extraídos:** ${{ steps.extract.outputs.files }}
            - **Origem:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Os ZIPs originais foram removidos neste PR após a extração.

            Confira os arquivos extraídos e os checks antes de fazer merge.
