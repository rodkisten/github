name: Setup Node workspace
description: Setup Node.js with npm cache and optional deterministic install
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24'
  working-directory:
    description: Project directory
    required: false
    default: '.'
  install:
    description: Run npm ci
    required: false
    default: 'true'
  cache:
    description: Enable npm dependency cache
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci --no-audit --no-fund
