name: 🟩 Setup Node Workspace Runner
description: Node 24 TypeScript runner for verifying Node runtime and installing dependencies
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24'
  working-directory:
    description: Project directory
    required: false
    default: '.'
  install:
    description: Run npm ci / npm install
    required: false
    default: 'true'
outputs:
  node-version:
    description: Resolved Node.js version
runs:
  using: node24
  main: ../../dist/setup-node.js
