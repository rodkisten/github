name: Dispatch GitHub workflow
description: Execute a GitHub operation with optional automatic App authentication
inputs:
  app-id:
    description: GitHub App ID
    required: false
  private-key:
    description: GitHub App private key
    required: false
  token:
    description: Existing GitHub token
    required: false
  workflow:
    description: Workflow filename or ID
    required: true
  ref:
    description: Branch or tag
    default: main
  inputs:
    description: JSON object of workflow inputs
    default: "{}"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        HAS_ID: ${{ inputs.app-id != '' }}
        HAS_KEY: ${{ inputs.private-key != '' }}
        HAS_TOKEN: ${{ inputs.token != '' }}
      run: >
        if [[ "$HAS_ID" != "$HAS_KEY" || ( "$HAS_ID" != true && "$HAS_TOKEN" !=
        true ) ]]; then
          echo "::error::Provide app-id and private-key together, or token"
          exit 1
        fi
    - id: auth
      if: inputs.app-id != '' && inputs.private-key != ''
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: read
        permission-actions: write
    - shell: bash
      env:
        GH_TOKEN: ${{ steps.auth.outputs.token || inputs.token }}
        WORKFLOW: ${{ inputs.workflow }}
        TARGET_REF: ${{ inputs.ref }}
        WORKFLOW_INPUTS: ${{ inputs.inputs }}
        TARGET_REPO: ${{ github.repository }}
      run: >
        set -euo pipefail

        printf '%s' "$WORKFLOW_INPUTS" | gh workflow run --repo "$TARGET_REPO"
        --ref "$TARGET_REF" --json -- "$WORKFLOW"
