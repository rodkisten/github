name: 📋 Rod Format PR Report
description: Create or update a single formatted PR summary comment
inputs:
  app-id:
    description: GitHub App ID for automatic authentication
    required: false
  private-key:
    description: GitHub App private key for automatic authentication
    required: false
  github-token:
    required: false
    description: GitHub App installation token
  pr-number:
    required: true
    description: Pull request number
  results-file:
    required: true
    description: JSON results from format action
  mode:
    default: check
  scope:
    default: changed
outputs:
  comment-updated:
    description: Whether the PR report comment was created or updated
    value: ${{ steps.operation.outputs.comment-updated }}
runs:
  using: composite
  steps:
    - name: Validate authentication inputs
      shell: bash
      env:
        HAS_APP_ID: ${{ inputs.app-id != '' }}
        HAS_PRIVATE_KEY: ${{ inputs.private-key != '' }}
      run: |
        if [[ "$HAS_APP_ID" != "$HAS_PRIVATE_KEY" ]]; then
          echo "::error::Provide both app-id and private-key"
          exit 1
        fi
    - id: auth
      if: inputs.app-id != '' && inputs.private-key != ''
      uses: rodkisten/github/src/app-token@main
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: read
        permission-pull-requests: write
        permission-issues: write
    - id: operation
      uses: rodkisten/github/src/format-report/internal@main
      with:
        github-token: ${{ steps.auth.outputs.token || inputs.github-token }}
        pr-number: ${{ inputs.pr-number }}
        results-file: ${{ inputs.results-file }}
        mode: ${{ inputs.mode }}
        scope: ${{ inputs.scope }}
