name: 🟩 Setup Node workspace
description: Setup Node.js with npm cache and optional deterministic install
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24'
  working-directory:
    description: Project directory
    required: false
    default: '.'
  install:
    description: Run npm ci / npm install
    required: false
    default: 'true'
  cache:
    description: Enable npm dependency cache
    required: false
    default: 'true'
outputs:
  node-version:
    description: Installed Node.js version
    value: ${{ steps.workspace.outputs.node-version }}
runs:
  using: composite
  steps:
    - name: 🟩 Cache & Node.js runtime
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
    - name: 📦 Bootstrap Node workspace
      id: workspace
      uses: rodkisten/github/actions/setup-node-runner@main
      with:
        node-version: ${{ inputs.node-version }}
        working-directory: ${{ inputs.working-directory }}
        install: ${{ inputs.install }}
