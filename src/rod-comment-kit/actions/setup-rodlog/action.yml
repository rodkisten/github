name: 🌈 Setup rodlog
description: Install the published rodlog binary with SHA-256 verification
inputs:
  release-base:
    description: Trusted HTTPS mirror with rodlog binaries and checksums
    required: false
    default: https://rodkisten.github.io/rodlog/releases
outputs:
  binary:
    description: Absolute path to verified rodlog binary
runs:
  using: node24
  main: ../../dist/setup-rodlog.js
