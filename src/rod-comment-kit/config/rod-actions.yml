version: 1
console:
  enabled: true
  renderer: rodlog
hooks:
  shell:
    enabled: false
    notifyOn: [failure]
  github:
    enabled: true
    notifyOn: [step.failure, job.completed, release.published]
notify:
  enabled: false
  provider: relay
  debounceSeconds: 5
  ignore: [cancelled, skipped]
  groupBy: [repository, run_id]
release:
  mode: hybrid
  initialVersion: 1.0.0
